  - title: Circuits
    path: circuits
    icon: mdi:chart-timeline-variant
    subview: true
    type: sections
    max_columns: 1
    background: transparent
    badges:
      - entity: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
        name: HVAC Load
        color: cyan
      - entity: sensor.fridge_circuit_circuit_fridge
        name: Refrigerator
        color: teal
      - entity: sensor.home_solar_energy_monitor_circuit_office
        name: Office / Study
        color: light-blue
      - entity: sensor.home_solar_energy_monitor_circuit_dedicated_freezer
        name: Freezer
        color: purple
      - entity: sensor.home_solar_energy_monitor_circuit_master_bed
        name: Master Bed
        color: amber
      - entity: sensor.home_solar_energy_monitor_circuit_microwave
        name: Microwave
        color: pink
    sections:
      - type: grid
        cards:
          - type: markdown
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown:
                  $: >
                    ha-markdown-element {
                      text-align: center !important;
                    }

                    h2 {
                      text-align: center !important;
                      font-size: 20px !important;
                      font-weight: 800 !important;
                      letter-spacing: -0.3px !important;
                      margin: 0 !important;
                      line-height: 1.3 !important;
                      background: linear-gradient(90deg, #2dd4bf 20%, #38bdf8 80%);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                    }
                .: >
                  ha-card {
                    text-align: center !important;
                    background: linear-gradient(135deg, rgba(45,212,191,0.15) 0%, rgba(56,189,248,0.08) 50%, rgba(15,23,42,0.95) 100%) !important;
                    border: 1px solid rgba(45, 212, 191, 0.25) !important;
                    border-radius: 20px !important;
                    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
                    padding: 18px 22px 14px 22px !important;
                    backdrop-filter: blur(20px) !important;
                    -webkit-backdrop-filter: blur(20px) !important;
                  }
            content: |-
              ## 🎛️ Circuit Intelligence • Submetering & Panel Twin <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;">
                <span style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);padding:4px 10px;border-radius:12px;font-size:11px;color:#f1f5f9;">⚡ Panel: <strong>Square D QO (32-Space)</strong></span>
                <span style="background:rgba(45,212,191,0.12);border:1px solid rgba(45,212,191,0.25);padding:4px 10px;border-radius:12px;font-size:11px;color:#2dd4bf;">🗲 8 Vue CT Clamps</span>
                <span style="background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.25);padding:4px 10px;border-radius:12px;font-size:11px;color:#38bdf8;">🌡️ 1 Nest Dynamic Thermal</span>
                <span style="background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.25);padding:4px 10px;border-radius:12px;font-size:11px;color:#c084fc;">📊 14 Mapped Breakers</span>
              </div>
      - type: grid
        cards:
          - type: heading
            heading: Google Nest HVAC Monitor (Carrier 3.5-Ton Single Stage)
            icon: mdi:thermostat
            card_mod:
              style: >
                ha-card {
                  text-align: center !important;
                  justify-content: center !important;
                  display: flex !important;
                }

                .heading { text-align: center !important; justify-content:
                center !important; }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: climate.master_bedroom_main_thermostat
                name: Nest Thermostat
                icon: mdi:thermostat
                color: cyan
                features:
                  - type: climate-hvac-modes
                    hvac_modes:
                      - off
                      - cool
                      - heat
              - type: tile
                entity: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
                name: Live Power Draw
                icon: mdi:hvac
                color: cyan
              - type: tile
                entity: sensor.home_solar_energy_monitor_hvac_consumed_today
                name: Consumed Today
                icon: mdi:chart-donut
                color: teal
              - type: tile
                entity: sensor.home_solar_energy_monitor_hvac_runtime_today
                name: Compressor Runtime
                icon: mdi:clock-outline
                color: light-blue
          - type: markdown
            card_mod:
              style:
                ha-markdown:
                  $: >
                    ha-markdown-element { text-align: center !important; }

                    h3 { text-align: center !important; margin: 0 0 8px 0
                    !important; }

                    p { text-align: center !important; }
                .: |
                  ha-card {
                    text-align: center !important;
                    background: rgba(15, 23, 42, 0.75) !important;
                    backdrop-filter: blur(16px) !important;
                    border: 1px solid rgba(255, 255, 255, 0.10) !important;
                    border-radius: 18px !important;
                    padding: 14px 18px !important;
                  }
            content: |-
              {% set action = state_attr('climate.master_bedroom_main_thermostat', 'hvac_action') | default('idle', true) %}
              {% set cur_temp = state_attr('climate.master_bedroom_main_thermostat', 'current_temperature') %}
              {% set target_temp = state_attr('climate.master_bedroom_main_thermostat', 'temperature') %}
              {% set out_temp = state_attr('weather.forecast_home', 'temperature') | default(85, true) %}
              {% set watts = states('sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat') | int(0) %}
              {% set hvac_kwh = states('sensor.home_solar_energy_monitor_hvac_consumed_today') | float(0) %}
              {% set runtime_hrs = states('sensor.home_solar_energy_monitor_hvac_runtime_today') | float(0) %}
              {% set hvac_cost = states('sensor.home_solar_energy_monitor_hvac_energy_cost_today') | default('0.00') %}
              {% set duty = states('sensor.home_solar_energy_monitor_hvac_duty_cycle') | float(0) %}
              <div style="display:flex;justify-content:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
                <span style="background:rgba(6,182,212,0.15);border:1px solid rgba(6,182,212,0.3);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#22d3ee;">❄️ Consumed Today: {{ hvac_kwh }} kWh</span>
                <span style="background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.3);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#38bdf8;">⏱️ Runtime: {{ runtime_hrs }} hrs ({{ duty }}% duty)</span>
                <span style="background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.3);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#34d399;">💵 Cost: ${{ hvac_cost }}</span>
              </div>
              {% if action == 'cooling' %}
              ### ❄️ Central AC Running (Cooling)
              **Inside:** {{ cur_temp }}°F &nbsp;•&nbsp; **Target:** {{ target_temp }}°F &nbsp;•&nbsp; **Outdoor Ambient:** {{ out_temp }}°F  
              **Estimated System Load:** **{{ watts }} W**  
              *Carrier CA16NA042 (3.5-Ton Single Stage) • Thermal model with outdoor head pressure compensation*
              {% elif action == 'heating' %}
              ### 🔥 Gas Furnace Active (Heating)
              **Inside:** {{ cur_temp }}°F &nbsp;•&nbsp; **Target:** {{ target_temp }}°F  
              **Indoor Blower & Inducer Load:** **{{ watts }} W**  
              *Natural Gas Heating • Indoor Air Circulation Fan Active*
              {% elif action == 'fan' %}
              ### 💨 Blower Circulation Fan Only
              **Inside:** {{ cur_temp }}°F &nbsp;•&nbsp; **Target:** {{ target_temp }}°F  
              **Fan Power Draw:** **{{ watts }} W**
              {% else %}
              ### 💤 HVAC Idle (Compressor Off)
              **Inside:** {{ cur_temp }}°F &nbsp;•&nbsp; **Target:** {{ target_temp }}°F &nbsp;•&nbsp; **Outdoor:** {{ out_temp }}°F  
              **HVAC Draw:** **0 W**  
              *Carrier CA16NA042 Standby • 0 W Draw*
              {% endif %}
