            icon_color: rgba(226, 232, 240, 0.75)
            active_color: "#10b981"
            badge_content: >-
              {% set st = states('sensor.cps_energy_smart_meter_ami_cps_sync_status') | lower %}
              {% if st not in ['synced', 'ok', 'online'] %}!{% endif %}
            badge_color: "#ef4444"
          - icon: mdi:server-network
            label: System
            path: /solar-hub/system
            icon_color: rgba(226, 232, 240, 0.75)
            active_color: "#c084fc"
            badge_content: "{% set errs =
              states('sensor.home_solar_energy_monitor_daemon_error_count') |
              int(0) %}{% if errs > 0 %}{{ errs }}{% endif %}"
            badge_color: "#ef4444"
  - title: Appliances
    path: appliances
    icon: mdi:washing-machine
    subview: true
    type: sections
    max_columns: 1
    background: transparent
    badges:
      - entity: input_boolean.appliance_dryer
        name: Dryer
        color: deep-orange
      - entity: input_boolean.appliance_oven
        name: Oven
        color: amber
      - entity: input_boolean.appliance_washer
        name: Washer
        color: light-blue
      - entity: sensor.home_solar_energy_monitor_circuit_electric_dryer_lg_dlex3370w
        name: Dryer Draw
        color: orange
      - entity: sensor.home_solar_energy_monitor_circuit_wall_oven_ge_jt3000sf3ss
        name: Oven Draw
        color: amber
      - entity: sensor.home_solar_energy_monitor_circuit_washing_machine
        name: Washer Draw
        color: cyan
      - entity: sensor.home_solar_energy_monitor_self_powered_ratio
        name: Self-Powered
        color: green
    sections:
      # Section 1: Hero Banner & Smart Solar Dispatch Window
      - type: grid
        cards:
          - type: markdown
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown:
                  $: >
                    ha-markdown-element {
                      text-align: center !important;
                    }
                    h2 {
                      text-align: center !important;
                      font-size: 20px !important;
                      font-weight: 800 !important;
                      letter-spacing: -0.3px !important;
                      margin: 0 !important;
                      line-height: 1.3 !important;
                      background: linear-gradient(90deg, #f97316 20%, #fbbf24 80%);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                    }
                .: >
                  ha-card {
                    text-align: center !important;
                    background: linear-gradient(135deg, rgba(249,115,22,0.18) 0%, rgba(245,158,11,0.08) 50%, rgba(15,23,42,0.95) 100%) !important;
                    border: 1px solid rgba(249, 115, 22, 0.30) !important;
                    border-radius: 20px !important;
                    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
                    padding: 18px 22px 14px 22px !important;
                    backdrop-filter: blur(20px) !important;
                    -webkit-backdrop-filter: blur(20px) !important;
                  }
            content: |-
              {% set dryer_w = states('sensor.home_solar_energy_monitor_circuit_electric_dryer_lg_dlex3370w') | int(0) %}
              {% set oven_w = states('sensor.home_solar_energy_monitor_circuit_wall_oven_ge_jt3000sf3ss') | int(0) %}
              {% set washer_w = states('sensor.home_solar_energy_monitor_circuit_washing_machine') | int(0) %}
              {% set total_w = dryer_w + oven_w + washer_w %}
              {% set dryer_kwh = states('sensor.home_solar_energy_monitor_dryer_consumed_today') | float(0) %}
              {% set oven_kwh = states('sensor.home_solar_energy_monitor_oven_consumed_today') | float(0) %}
              {% set washer_kwh = states('sensor.home_solar_energy_monitor_washer_consumed_today') | float(0) %}
              {% set total_kwh = (dryer_kwh + oven_kwh + washer_kwh) | round(2) %}
              {% set dryer_cost = states('sensor.home_solar_energy_monitor_dryer_energy_cost_today') | float(0) %}
              {% set oven_cost = states('sensor.home_solar_energy_monitor_oven_energy_cost_today') | float(0) %}
              {% set washer_cost = states('sensor.home_solar_energy_monitor_washer_energy_cost_today') | float(0) %}
              {% set total_cost = (dryer_cost + oven_cost + washer_cost) | round(2) %}
              ## 🧺 High-Draw Appliance Command Center
              <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;">
                <span style="background:rgba(249,115,22,0.15);border:1px solid rgba(249,115,22,0.3);padding:4px 10px;border-radius:12px;font-size:11px;color:#fb923c;">⚡ Live Load: <strong>{{ total_w }} W</strong></span>
                <span style="background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);padding:4px 10px;border-radius:12px;font-size:11px;color:#fbbf24;">📊 Consumed Today: <strong>{{ total_kwh }} kWh</strong></span>
                <span style="background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);padding:4px 10px;border-radius:12px;font-size:11px;color:#34d399;">💵 Today's Cost: <strong>${{ total_cost }}</strong></span>
              </div>
          - type: markdown
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.70) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  border-radius: 14px !important;
                  backdrop-filter: blur(16px) !important;
                  padding: 10px 16px !important;
                }
            content: |-
              {% set solar_w = states('sensor.home_solar_energy_monitor_solar_production') | float(0) %}
              {% set export_w = states('sensor.home_solar_energy_monitor_grid_export_power') | float(0) %}
              {% set net_grid = states('sensor.home_solar_energy_monitor_grid_net_power') | float(0) %}
              {% if export_w > 2000 %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#10b981;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;"></span>
                    ☀️ PRIME SOLAR DISPATCH WINDOW
                  </span>
                  <span style="color:#a7f3d0;">Exporting <strong style="color:#34d399;">+{{ (export_w / 1000) | round(1) }} kW</strong> to grid • Run Dryer (5.4 kW) or Oven (4.2 kW) now on <strong>100% free rooftop solar</strong>!</span>
                </div>
              {% elif solar_w > 1500 and export_w > 0 %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#f59e0b;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 8px #f59e0b;"></span>
                    🌤️ MODERATE SOLAR SURPLUS
                  </span>
                  <span style="color:#fde68a;">Surplus <strong style="color:#fbbf24;">+{{ (export_w / 1000) | round(1) }} kW</strong> • High-draw loads will be substantially offset by solar.</span>
                </div>
              {% elif solar_w > 500 %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#38bdf8;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#38bdf8;box-shadow:0 0 8px #38bdf8;"></span>
                    🌥️ PARTIAL SOLAR GENERATION
                  </span>
                  <span style="color:#bae6fd;">Solar generating <strong style="color:#38bdf8;">{{ (solar_w / 1000) | round(1) }} kW</strong> • Running 240V heavy appliances will draw the balance from the grid.</span>
                </div>
              {% else %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#94a3b8;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;box-shadow:0 0 8px #94a3b8;"></span>
                    🌙 GRID-POWERED RUN WINDOW
                  </span>
                  <span style="color:#94a3b8;">Solar dormant • Appliances will run from grid power at CPS standard tier (<strong style="color:#f1f5f9;">$0.11/kWh</strong>).</span>
                </div>
              {% endif %}

