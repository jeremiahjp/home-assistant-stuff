title: Solar Command Hub
theme: celestial
views:
  - title: Live Flow
    path: live
    icon: mdi:lightning-bolt-circle
    type: sections
    max_columns: 1
    background: transparent
    badges:
      - entity: binary_sensor.home_solar_energy_monitor_solar_daemon_service
        name: Daemon
        color: teal
      - entity: sensor.home_solar_energy_monitor_solar_production
        name: Solar
        color: amber
      - entity: sensor.home_solar_energy_monitor_house_consumption
        name: House
        color: blue
      - entity: sensor.home_solar_energy_monitor_grid_net_power
        name: Grid Net
        color: purple
      - entity: sensor.home_solar_energy_monitor_self_powered_ratio
        name: Self-Powered
        color: green
      - entity: sensor.home_solar_energy_monitor_inverter_temperature
        name: Inverter Temp
      - entity: sensor.home_solar_energy_monitor_hvac_consumed_today
        name: HVAC Today
        color: cyan
    sections:
      - type: grid
        cards:
          - type: markdown
            card_mod:
              style:
                ha-markdown:
                  $: >
                    ha-markdown-element {
                      text-align: center !important;
                    }

                    h2 {
                      text-align: center !important;
                      font-size: 20px !important;
                      font-weight: 800 !important;
                      letter-spacing: -0.3px !important;
                      margin: 0 !important;
                      line-height: 1.3 !important;
                      background: linear-gradient(90deg, #fff 30%, rgba(255,255,255,0.65));
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                    }

                    div {
                      display: flex !important;
                      flex-wrap: wrap !important;
                      justify-content: center !important;
                      align-items: center !important;
                      gap: 6px !important;
                      margin-top: 10px !important;
                      width: 100% !important;
                    }

                    span {
                      display: inline-flex !important;
                      align-items: center !important;
                      justify-content: center !important;
                    }
                .: >
                  {% set elev = state_attr('sun.sun', 'elevation') | float(0) %}

                  {% set azi = state_attr('sun.sun', 'azimuth') | float(180) %}

                  {% if elev > 20 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,179,0,0.22) 0%, rgba(255,100,0,0.08) 40%, rgba(15,23,42,0.92) 100%)" %}
                    {% set bdr = "rgba(255,179,0,0.35)" %}
                    {% set glow = "0 8px 40px rgba(255,140,0,0.18), inset 0 1px 0 rgba(255,255,255,0.08)" %}
                    {% set shimmer = "rgba(255,200,50,0.07)" %}
                  {% elif elev > 5 and azi < 180 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,200,50,0.18) 0%, rgba(255,160,0,0.08) 40%, rgba(15,23,42,0.92) 100%)" %}
                    {% set bdr = "rgba(255,200,50,0.30)" %}
                    {% set glow = "0 8px 40px rgba(255,180,0,0.14), inset 0 1px 0 rgba(255,255,255,0.06)" %}
                    {% set shimmer = "rgba(255,200,50,0.06)" %}
                  {% elif elev > 5 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,120,0,0.20) 0%, rgba(200,50,100,0.08) 40%, rgba(15,23,42,0.92) 100%)" %}
                    {% set bdr = "rgba(255,120,0,0.30)" %}
                    {% set glow = "0 8px 40px rgba(255,100,0,0.14), inset 0 1px 0 rgba(255,255,255,0.06)" %}
                    {% set shimmer = "rgba(255,150,50,0.06)" %}
                  {% elif elev > -2 and azi < 180 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,130,50,0.20) 0%, rgba(180,80,160,0.12) 40%, rgba(15,23,42,0.94) 100%)" %}
                    {% set bdr = "rgba(255,130,50,0.28)" %}
                    {% set glow = "0 8px 40px rgba(255,100,50,0.12), inset 0 1px 0 rgba(255,255,255,0.05)" %}
                    {% set shimmer = "rgba(255,140,80,0.05)" %}
                  {% elif elev > -2 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,87,34,0.22) 0%, rgba(156,39,176,0.12) 40%, rgba(15,23,42,0.94) 100%)" %}
                    {% set bdr = "rgba(255,87,34,0.30)" %}
                    {% set glow = "0 8px 40px rgba(255,87,34,0.14), inset 0 1px 0 rgba(255,255,255,0.05)" %}
                    {% set shimmer = "rgba(255,100,60,0.05)" %}
                  {% elif elev > -6 %}
                    {% set bg = "linear-gradient(135deg, rgba(100,50,150,0.22) 0%, rgba(50,30,100,0.12) 40%, rgba(12,18,38,0.96) 100%)" %}
                    {% set bdr = "rgba(130,80,200,0.22)" %}
                    {% set glow = "0 8px 40px rgba(100,50,150,0.10), inset 0 1px 0 rgba(255,255,255,0.04)" %}
                    {% set shimmer = "rgba(120,80,200,0.04)" %}
                  {% else %}
                    {% set bg = "linear-gradient(135deg, rgba(30,40,80,0.5) 0%, rgba(15,20,50,0.6) 50%, rgba(10,12,30,0.97) 100%)" %}
                    {% set bdr = "rgba(80,100,180,0.18)" %}
                    {% set glow = "0 8px 40px rgba(30,50,120,0.08), inset 0 1px 0 rgba(255,255,255,0.03)" %}
                    {% set shimmer = "rgba(60,80,180,0.03)" %}
                  {% endif %}

                  ha-card {
                    text-align: center !important;
                    background: {{ bg }} !important;
                    border: 1px solid {{ bdr }} !important;
                    border-radius: 20px !important;
                    box-shadow: {{ glow }} !important;
                    padding: 18px 22px 14px 22px !important;
                    backdrop-filter: blur(20px) !important;
                    -webkit-backdrop-filter: blur(20px) !important;
                    position: relative !important;
                    overflow: hidden !important;
                    transition: all 0.6s ease !important;
                  }

                  ha-card::before {
                    content: '';
                    position: absolute;
                    top: -80%;
                    left: -80%;
                    width: 260%;
                    height: 260%;
                    background: radial-gradient(ellipse, {{ shimmer }} 0%, transparent 55%);
                    animation: hero-shimmer 6s ease-in-out infinite;
                    pointer-events: none;
                  }

                  @keyframes hero-shimmer {
                    0%, 100% { opacity: 0.4; transform: translate(0, 0) scale(1); }
                    50% { opacity: 1; transform: translate(5%, 5%) scale(1.1); }
                  }
            content: |-
              {% set solar = states('sensor.home_solar_energy_monitor_solar_production') | float(0) %} {% set house = states('sensor.home_solar_energy_monitor_house_consumption') | float(0) %} {% set elev = state_attr('sun.sun', 'elevation') | float(0) %} {% set azi = state_attr('sun.sun', 'azimuth') | float(180) %} {% set rising = azi < 180 %} {% set next_set = state_attr('sun.sun', 'next_setting') %} {% set next_rise = state_attr('sun.sun', 'next_rising') %} {% set temp = state_attr('weather.forecast_home', 'temperature') | float(0) | round(0) %} {% set clouds = state_attr('weather.forecast_home', 'cloud_coverage') | float(0) | round(0) %} {% set weather_raw = states('weather.forecast_home') %} {% set weather_txt = weather_raw | replace('-', ' ') | title if weather_raw not in ['unknown', 'unavailable'] else '' %} {% if elev > 20 %}
                {% set title = "☀️ FULL DAYLIGHT • PEAK SUN" %}
              {% elif elev > 5 and rising %}
                {% set title = "🌤️ MORNING GOLDEN HOUR" %}
              {% elif elev > 5 %}
                {% set title = "🌇 AFTERNOON GOLDEN HOUR" %}
              {% elif elev > -2 and rising %}
                {% set title = "🌅 SUNRISE • DAY DAWNING" %}
              {% elif elev > -2 %}
                {% set title = "🌆 SUNSET • FINAL LIGHT" %}
              {% elif elev > -6 and rising %}
                {% set title = "🌃 EARLY DAWN • FIRST LIGHT" %}
              {% elif elev > -6 %}
                {% set title = "🌆 LATE DUSK • TWILIGHT" %}
              {% else %}
                {% set title = "🌙 DEEP NIGHT • STARFIELD" %}
              {% endif %} {% set pill = 'display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.3px;' %} {% set pill_bg = 'background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.85);' %}
              ## {{ title }}
              <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;"> <span style="{{ pill }}{{ pill_bg }}">🌡️ {{ temp }}°F {{ weather_txt }}</span> <span style="{{ pill }}{{ pill_bg }}">⚡ {{ solar | round(0) }} W{% if solar > 0 %} ({{ (solar / 78.4) | round(0) }}%){% endif %}</span> <span style="{{ pill }}{{ pill_bg }}">☁️ {{ clouds }}%</span> <span style="{{ pill }}{{ pill_bg }}">📐 {{ elev | round(1) }}°</span> {% if elev > -2 and not rising %} <span style="{{ pill }}{{ pill_bg }}">🌅 {{ as_timestamp(next_set) | timestamp_custom('%I:%M %p') if next_set else '—' }}</span> {% elif elev <= -2 %} <span style="{{ pill }}{{ pill_bg }}">🌄 {{ as_timestamp(next_rise) | timestamp_custom('%I:%M %p') if next_rise else '—' }}</span> {% endif %} <span style="{{ pill }}{{ pill_bg }}">🏠 {{ house | round(0) }} W</span> </div>
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: custom:power-flow-card-plus
            title: Live Energy Distribution
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.75) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  border-radius: 20px !important;
                  backdrop-filter: blur(16px) !important;
                  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
                }
                .card-header {
                  text-align: center !important;
                  justify-content: center !important;
                  display: flex !important;
                  font-weight: 700 !important;
                  letter-spacing: -0.2px !important;
                }
            entities:
              solar:
                entity: sensor.home_solar_energy_monitor_solar_production
                name: Solar
                icon: mdi:solar-power
                color_icon: true
                display_zero: true
                secondary_info:
                  entity: sensor.home_solar_energy_monitor_solar_produced_today
                  unit_of_measurement: kWh
              grid:
                entity: sensor.home_solar_energy_monitor_grid_net_power
                name: Grid
                icon: mdi:transmission-tower
                color_icon: true
                display_zero: true
                secondary_info:
                  entity: sensor.home_solar_energy_monitor_net_energy_cost_today
              home:
                entity: sensor.home_solar_energy_monitor_house_consumption
                name: House
                icon: mdi:home-lightning-bolt
                color_icon: true
                secondary_info:
                  entity: sensor.home_solar_energy_monitor_house_consumed_today
                  unit_of_measurement: kWh
                individual:
                  - entity: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
                    name: HVAC / AC (est)
                    icon: mdi:hvac
                    color_icon: true
                    secondary_info:
                      entity: sensor.home_solar_energy_monitor_hvac_consumed_today
                      unit_of_measurement: kWh
                  - entity: sensor.home_solar_energy_monitor_circuit_office
                    name: Office
                    icon: mdi:desktop-tower
                    color_icon: true
                    secondary_info:
                      entity: sensor.home_solar_energy_monitor_circuit_office
                  - entity: sensor.fridge_circuit_circuit_fridge
                    name: Fridge
                    icon: mdi:fridge-outline
                    color_icon: true
                  - entity: sensor.home_solar_energy_monitor_circuit_master_bed
                    name: Master Bed
                    icon: mdi:bed
                    color_icon: true
                  - entity: sensor.home_solar_energy_monitor_circuit_dedicated_freezer
                    name: Freezer
                    icon: mdi:snowflake
                    color_icon: true
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            w_decimals: 0
            kw_decimals: 2
            min_flow_rate: 0.9
            max_flow_rate: 6
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Central AC & Solar Cooling Dynamics
            icon: mdi:hvac
            card_mod:
              style: >
                ha-card {
                  text-align: center !important;
                  justify-content: center !important;
                  display: flex !important;
                }
                .heading { text-align: center !important; justify-content: center !important; }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.solar_adjusted_cooling_usage_today
                name: Net AC Runtime
                needle: true
                min: 0
                max: 8
                severity:
                  green: 0
                  yellow: 4.5
                  red: 6
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 18px !important;
                      backdrop-filter: blur(16px) !important;
                    }
              - type: gauge
                entity: sensor.home_solar_energy_monitor_hvac_duty_cycle
                name: Cooling Duty Cycle
                needle: true
                min: 0
                max: 100
                severity:
                  green: 0
                  yellow: 40
                  red: 65
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 18px !important;
                      backdrop-filter: blur(16px) !important;
                    }
          - type: markdown
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown:
                  $: |
                    ha-markdown-element { text-align: center !important; }
                .: |
                  ha-card {
                    background: rgba(15, 23, 42, 0.70) !important;
                    border: 1px solid rgba(255, 255, 255, 0.10) !important;
                    border-radius: 14px !important;
                    backdrop-filter: blur(16px) !important;
                    padding: 8px 16px !important;
                  }
            content: |-
              {% set run = states('sensor.home_solar_energy_monitor_hvac_runtime_today') | float(0) %}
              {% set earned = states('sensor.solar_cooling_budget_earned_today') | float(0) %}
              {% set net_run = [ (run - earned) | round(2), 0 ] | max %}
              {% set offset_pct = [ ((earned / run * 100) if run > 0 else 0) | round(0), 100 ] | min %}
              {% set budget_pct = [ ((net_run / 8.0 * 100) | round(0)), 100 ] | min %}

              {% set solar_active_w = states('sensor.home_solar_energy_monitor_solar_production') | float(0) %}
              {% set grid_net_w = states('sensor.home_solar_energy_monitor_grid_net_power') | float(0) %}
              {% set is_solar_surplus = grid_net_w <= 0 and solar_active_w > 300 %}

              {% if is_solar_surplus %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#10b981;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;"></span>
                    SOLAR OFFSET ACTIVE • 100% GRID-FREE (EXPORTING {{ (grid_net_w | abs / 1000) | round(1) }} kW)
                  </span>
                  <span style="color:#94a3b8;">Gross AC: <strong style="color:#f1f5f9;">{{ run }}h</strong> &nbsp;•&nbsp; Solar Offset: <strong style="color:#10b981;">-{{ earned }}h ({{ offset_pct }}%)</strong> &nbsp;•&nbsp; Net AC Runtime: <strong style="color:#22d3ee;">{{ net_run }}h / 8.0h ({{ budget_pct }}%)</strong></span>
                </div>
              {% elif net_run <= 4.5 %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#10b981;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;"></span>
                    ON TRACK • {{ offset_pct }}% AC OFFSET BY SOLAR
                  </span>
                  <span style="color:#94a3b8;">Gross AC: <strong style="color:#f1f5f9;">{{ run }}h</strong> &nbsp;•&nbsp; Solar Offset: <strong style="color:#10b981;">-{{ earned }}h ({{ offset_pct }}%)</strong> &nbsp;•&nbsp; Net AC Runtime: <strong style="color:#22d3ee;">{{ net_run }}h / 8.0h ({{ budget_pct }}%)</strong></span>
                </div>
              {% elif net_run <= 6.0 %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#f59e0b;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 8px #f59e0b;"></span>
                    APPROACHING BUDGET LIMIT • {{ budget_pct }}% USED
                  </span>
                  <span style="color:#94a3b8;">Gross AC: <strong style="color:#f1f5f9;">{{ run }}h</strong> &nbsp;•&nbsp; Solar Offset: <strong style="color:#10b981;">-{{ earned }}h ({{ offset_pct }}%)</strong> &nbsp;•&nbsp; Net AC Runtime: <strong style="color:#f59e0b;">{{ net_run }}h / 8.0h</strong></span>
                </div>
              {% else %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#ef4444;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
                    BUDGET CRITICAL • {{ budget_pct }}% USED
                  </span>
                  <span style="color:#f87171;">Gross AC: <strong style="color:#f1f5f9;">{{ run }}h</strong> &nbsp;•&nbsp; Solar Offset: <strong style="color:#10b981;">-{{ earned }}h ({{ offset_pct }}%)</strong> &nbsp;•&nbsp; Net AC Runtime: <strong style="color:#ef4444;">{{ net_run }}h / 8.0h</strong></span>
                </div>
              {% endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: climate.master_bedroom_main_thermostat
                name: Nest Thermostat
                icon: mdi:thermostat
                color: light-blue
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
                name: Live HVAC Draw
                icon: mdi:lightning-bolt-outline
                color: cyan
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_hvac_consumed_today
                name: HVAC Consumed Today
                icon: mdi:hvac
                color: teal
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_hvac_energy_cost_today
                name: HVAC Cost Today
                icon: mdi:currency-usd
                color: green
                vertical: false
          - type: markdown
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown:
                  $: |
                    ha-markdown-element { text-align: center !important; }
                .: |
                  ha-card {
                    background: transparent !important;
                    border: none !important;
                    box-shadow: none !important;
                    padding: 0 4px !important;
                    margin-top: -4px !important;
                  }
            content: |-
              {% set solar_today = states('sensor.home_solar_energy_monitor_solar_produced_today') | float(0) %}
              {% set house_today = states('sensor.home_solar_energy_monitor_house_consumed_today') | float(0) %}
              {% set hvac_kwh = states('sensor.home_solar_energy_monitor_hvac_consumed_today') | float(0) %}
              {% set base_house = [ (house_today - hvac_kwh), 0 ] | max %}
              {% set net_solar_kwh = [ (solar_today - base_house), 0 ] | max %}
              {% set live_w = states('sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat') | float(0) %}
              {% set nominal_w = state_attr('sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat', 'nominal_cooling_watts') | default(3275, true) | float(3275) %}
              {% set cooling_kw = [ (live_w if live_w > 500 else nominal_w), 2500 ] | max / 1000.0 %}
              {% set earned_hrs = (net_solar_kwh / cooling_kw) | round(1) %}
              <div style="font-size:11px;color:#64748b;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
                <span>❄️ Carrier CA16NA042 (3.5T, dynamic {{ cooling_kw | round(2) }} kW)</span>
                <span>💨 58PHA ECM Blower (335W)</span>
                <span>🎯 Earned Today: {{ earned_hrs }}h ({{ net_solar_kwh | round(1) }} kWh net solar)</span>
              </div>
      - type: grid
        cards:
          - type: heading
            heading: Inverter Performance & Telemetry
            icon: mdi:solar-power-variant
            card_mod:
              style: >
                ha-card {
                  text-align: center !important;
                  justify-content: center !important;
                  display: flex !important;
                }

                .heading { text-align: center !important; justify-content:
                center !important; }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 18px !important;
                      backdrop-filter: blur(16px) !important;
                    }
                entity: sensor.home_solar_energy_monitor_solar_production
                name: Solar AC Output
                needle: true
                min: 0
                max: 7840
                severity:
                  green: 4500
                  yellow: 2000
                  red: 0
              - type: gauge
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 18px !important;
                      backdrop-filter: blur(16px) !important;
                    }
                entity: sensor.home_solar_energy_monitor_self_powered_ratio
                name: Self-Powered
                needle: true
                min: 0
                max: 100
                severity:
                  red: 0
                  yellow: 40
                  green: 75
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_dc_power
                name: Solar DC Input
                icon: mdi:solar-panel-large
                color: orange
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_inverter_temperature
                name: Inverter Temp
                icon: mdi:thermometer-check
                color: red
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_produced_today
                name: Solar Today
                icon: mdi:solar-power-variant
                color: amber
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_house_consumed_today
                name: House Today
                icon: mdi:home-lightning-bolt
                color: light-blue
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_grid_exported_today
                name: Grid Export Today
                icon: mdi:transmission-tower-export
                color: teal
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_grid_imported_today
                name: Grid Import Today
                icon: mdi:transmission-tower
                color: indigo
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_net_energy_cost_today
                name: Net Cost Today
                icon: mdi:cash-check
                color: green
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_lifetime_production
                name: Lifetime Harvest
                icon: mdi:medal-outline
                color: deep-purple
                vertical: false
    footer:
      card:
        type: custom:dashboard-footer-card
        background: rgba(10, 15, 29, 0.96)
        blur: true
        floating_mobile: true
        floating_desktop: true
        bottom_offset: 12px
        max_width: 660px
        icon_size: 24
        font_size: 11
        card_mod:
          style: >
            ha-card.footer-card {
              background: rgba(10, 15, 29, 0.95) !important;
              backdrop-filter: blur(24px) saturate(180%) !important;
              -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
              border: 1px solid rgba(255, 255, 255, 0.18) !important;
              box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 1px rgba(255, 255, 255, 0.2) !important;
              border-radius: 24px !important;
            }

