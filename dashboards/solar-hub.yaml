  - title: Analytics
    path: analytics
    icon: mdi:chart-bell-curve-cumulative
    subview: true
    type: sections
    max_columns: 1
    background: transparent
    badges:
      - entity: sensor.home_solar_energy_monitor_solar_produced_today
        name: Solar Today
        color: amber
      - entity: sensor.home_solar_energy_monitor_house_consumed_today
        name: House Today
        color: blue
      - entity: sensor.home_solar_energy_monitor_hvac_consumed_today
        name: AC Today
        color: cyan
      - entity: sensor.home_solar_energy_monitor_net_energy_cost_today
        name: Net Cost
        color: green
      - entity: sensor.home_solar_energy_monitor_self_powered_ratio
        name: Self-Powered
        color: teal
      - entity: sensor.home_solar_energy_monitor_grid_exported_today
        name: Exported
        color: purple
      - entity: sensor.home_solar_energy_monitor_solar_lifetime_production
        name: Lifetime MWh
        color: deep-purple
    sections:
      - type: grid
        cards:
          - type: markdown
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown:
                  $: >
                    ha-markdown-element {
                      text-align: center !important;
                    }

                    h2 {
                      text-align: center !important;
                      font-size: 20px !important;
                      font-weight: 800 !important;
                      letter-spacing: -0.3px !important;
                      margin: 0 !important;
                      line-height: 1.3 !important;
                      background: linear-gradient(90deg, #f59e0b 20%, #38bdf8 80%);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                    }
                .: >
                  ha-card {
                    text-align: center !important;
                    background: linear-gradient(135deg, rgba(245,158,11,0.15) 0%, rgba(56,189,248,0.08) 50%, rgba(15,23,42,0.95) 100%) !important;
                    border: 1px solid rgba(245, 158, 11, 0.25) !important;
                    border-radius: 20px !important;
                    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
                    padding: 18px 22px 14px 22px !important;
                    backdrop-filter: blur(20px) !important;
                    -webkit-backdrop-filter: blur(20px) !important;
                  }
            content: |-
              ## 📊 Solar Analytics • Flow Dynamics & Historical Trends <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px;">
                <span style="background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);padding:4px 10px;border-radius:12px;font-size:11px;color:#fbbf24;">⚡ Solar Harvest: <strong>{{ states('sensor.home_solar_energy_monitor_solar_produced_today') }} kWh</strong></span>
                <span style="background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.25);padding:4px 10px;border-radius:12px;font-size:11px;color:#38bdf8;">🏠 House Load: <strong>{{ states('sensor.home_solar_energy_monitor_house_consumed_today') }} kWh</strong></span>
                <span style="background:rgba(6,182,212,0.12);border:1px solid rgba(6,182,212,0.25);padding:4px 10px;border-radius:12px;font-size:11px;color:#22d3ee;">❄️ AC Load: <strong>{{ states('sensor.home_solar_energy_monitor_hvac_consumed_today') }} kWh</strong> ({{ states('sensor.home_solar_energy_monitor_hvac_runtime_today') }}h)</span>
                <span style="background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);padding:4px 10px;border-radius:12px;font-size:11px;color:#34d399;">🛡️ Self-Powered: <strong>{{ states('sensor.home_solar_energy_monitor_self_powered_ratio') }}%</strong></span>
                <span style="background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.25);padding:4px 10px;border-radius:12px;font-size:11px;color:#c084fc;">💵 Net Cost: <strong>${{ states('sensor.home_solar_energy_monitor_net_energy_cost_today') }}</strong></span>
              </div>
      - type: grid
        cards:
          - type: heading
            heading: Live Power Routing & Flow Distribution
            icon: mdi:sitemap
            card_mod:
              style: >
                ha-card {
                  text-align: center !important;
                  justify-content: center !important;
                  display: flex !important;
                }

                .heading { text-align: center !important; justify-content:
                center !important; }
          - type: custom:sankey-chart
            title: Real-Time Wattage Flow
            show_names: true
            round: 0
            unit_prefix: " "
            height: 230
            nodes:
              - id: sensor.home_solar_energy_monitor_solar_production
                name: Solar Generation
                color: "#ffb300"
                section: 0
              - id: grid_import
                entity_id: sensor.home_solar_energy_monitor_grid_import_power
                name: Grid Import
                color: "#ef4444"
                section: 0
              - id: sensor.home_solar_energy_monitor_house_consumption
                name: House Load
                color: "#00e5ff"
                section: 1
              - id: grid_export
                entity_id: sensor.home_solar_energy_monitor_grid_export_power
                name: Grid Export
                color: "#10b981"
                section: 1
              - id: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
                name: HVAC / AC (est)
                color: "#06b6d4"
                section: 2
              - id: sensor.home_solar_energy_monitor_circuit_office
                name: Office
                color: "#38bdf8"
                section: 2
              - id: sensor.fridge_circuit_circuit_fridge
                name: Refrigerator
                color: "#34d399"
                section: 2
              - id: sensor.home_solar_energy_monitor_circuit_master_bed
                name: Master Bed
                color: "#fbbf24"
                section: 2
              - id: house_other
                name: Other Circuits
                type: remaining_parent_state
                color: "#94a3b8"
                section: 2
            links:
              - source: sensor.home_solar_energy_monitor_solar_production
                target: sensor.home_solar_energy_monitor_house_consumption
              - source: sensor.home_solar_energy_monitor_solar_production
                target: grid_export
              - source: grid_import
                target: sensor.home_solar_energy_monitor_house_consumption
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: sensor.home_solar_energy_monitor_circuit_office
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: sensor.fridge_circuit_circuit_fridge
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: sensor.home_solar_energy_monitor_circuit_master_bed
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: house_other
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.75) !important;
                  backdrop-filter: blur(16px) !important;
                  -webkit-backdrop-filter: blur(16px) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  border-radius: 18px !important;
                  padding: 12px !important;
                }
      - type: grid
        cards:
          - type: heading
            heading: Central AC & HVAC Dynamics • Energy & Runtime
            icon: mdi:hvac
            card_mod:
              style: >
                ha-card {
                  text-align: center !important;
                  justify-content: center !important;
                  display: flex !important;
                }

                .heading { text-align: center !important; justify-content:
                center !important; }
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.solar_adjusted_cooling_usage_today
                name: Net AC Runtime
                needle: true
                min: 0
                max: 8
                severity:
                  green: 0
                  yellow: 4.5
                  red: 6
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 18px !important;
                      backdrop-filter: blur(16px) !important;
                    }
              - type: gauge
                entity: sensor.home_solar_energy_monitor_hvac_duty_cycle
                name: Cooling Duty Cycle
                needle: true
                min: 0
                max: 100
                severity:
                  green: 0
                  yellow: 40
                  red: 65
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 18px !important;
                      backdrop-filter: blur(16px) !important;
                    }
          - type: markdown
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown:
                  $: |
                    ha-markdown-element { text-align: center !important; }
                .: |
                  ha-card {
                    background: rgba(15, 23, 42, 0.70) !important;
                    border: 1px solid rgba(255, 255, 255, 0.10) !important;
                    border-radius: 14px !important;
                    backdrop-filter: blur(16px) !important;
                    padding: 8px 16px !important;
                  }
            content: |-
              {% set run = states('sensor.home_solar_energy_monitor_hvac_runtime_today') | float(0) %}
              {% set earned = states('sensor.solar_cooling_budget_earned_today') | float(0) %}
              {% set net_run = [ (run - earned) | round(2), 0 ] | max %}
              {% set offset_pct = [ ((earned / run * 100) if run > 0 else 0) | round(0), 100 ] | min %}
              {% set budget_pct = [ ((net_run / 8.0 * 100) | round(0)), 100 ] | min %}

              {% set solar_active_w = states('sensor.home_solar_energy_monitor_solar_production') | float(0) %}
              {% set grid_net_w = states('sensor.home_solar_energy_monitor_grid_net_power') | float(0) %}
              {% set is_solar_surplus = grid_net_w <= 0 and solar_active_w > 300 %}

              {% if is_solar_surplus %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#10b981;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;"></span>
                    SOLAR OFFSET ACTIVE • 100% GRID-FREE (EXPORTING {{ (grid_net_w | abs / 1000) | round(1) }} kW)
                  </span>
                  <span style="color:#94a3b8;">Gross AC: <strong style="color:#f1f5f9;">{{ run }}h</strong> &nbsp;•&nbsp; Solar Offset: <strong style="color:#10b981;">-{{ earned }}h ({{ offset_pct }}%)</strong> &nbsp;•&nbsp; Net AC Runtime: <strong style="color:#22d3ee;">{{ net_run }}h / 8.0h ({{ budget_pct }}%)</strong></span>
                </div>
              {% elif net_run <= 4.5 %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#10b981;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;"></span>
                    ON TRACK • {{ offset_pct }}% AC OFFSET BY SOLAR
                  </span>
                  <span style="color:#94a3b8;">Gross AC: <strong style="color:#f1f5f9;">{{ run }}h</strong> &nbsp;•&nbsp; Solar Offset: <strong style="color:#10b981;">-{{ earned }}h ({{ offset_pct }}%)</strong> &nbsp;•&nbsp; Net AC Runtime: <strong style="color:#22d3ee;">{{ net_run }}h / 8.0h ({{ budget_pct }}%)</strong></span>
                </div>
              {% elif net_run <= 6.0 %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#f59e0b;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 8px #f59e0b;"></span>
                    APPROACHING BUDGET LIMIT • {{ budget_pct }}% USED
                  </span>
                  <span style="color:#94a3b8;">Gross AC: <strong style="color:#f1f5f9;">{{ run }}h</strong> &nbsp;•&nbsp; Solar Offset: <strong style="color:#10b981;">-{{ earned }}h ({{ offset_pct }}%)</strong> &nbsp;•&nbsp; Net AC Runtime: <strong style="color:#f59e0b;">{{ net_run }}h / 8.0h</strong></span>
                </div>
              {% else %}
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;">
                  <span style="font-weight:700;color:#ef4444;display:inline-flex;align-items:center;gap:6px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444;"></span>
                    BUDGET CRITICAL • {{ budget_pct }}% USED
                  </span>
                  <span style="color:#f87171;">Gross AC: <strong style="color:#f1f5f9;">{{ run }}h</strong> &nbsp;•&nbsp; Solar Offset: <strong style="color:#10b981;">-{{ earned }}h ({{ offset_pct }}%)</strong> &nbsp;•&nbsp; Net AC Runtime: <strong style="color:#ef4444;">{{ net_run }}h / 8.0h</strong></span>
                </div>
              {% endif %}
          - type: horizontal-stack
            cards:
              - type: tile
                entity: sensor.home_solar_energy_monitor_hvac_consumed_today
                name: AC Today
                icon: mdi:hvac
                color: cyan
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 16px !important;
                    }
              - type: tile
                entity: sensor.home_solar_energy_monitor_hvac_runtime_today
                name: Runtime
                icon: mdi:timer-outline
                color: light-blue
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 16px !important;
                    }
              - type: tile
                entity: sensor.home_solar_energy_monitor_hvac_energy_cost_today
                name: AC Cost
                icon: mdi:currency-usd
                color: green
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 16px !important;
                    }
              - type: tile
                entity: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
                name: AC Draw
                icon: mdi:lightning-bolt
                color: teal
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(15, 23, 42, 0.75) !important;
                      border: 1px solid rgba(255, 255, 255, 0.10) !important;
                      border-radius: 16px !important;
                    }
          - type: markdown
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown:
                  $: |
                    ha-markdown-element { text-align: center !important; }
