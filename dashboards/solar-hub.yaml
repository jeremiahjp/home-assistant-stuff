    footer:
      card:
        type: custom:dashboard-footer-card
        background: rgba(10, 15, 29, 0.96)
        blur: true
        floating_mobile: true
        floating_desktop: true
        bottom_offset: 12px
        max_width: 660px
        icon_size: 24
        font_size: 11
        card_mod:
          style: >
            ha-card.footer-card {
              background: rgba(10, 15, 29, 0.95) !important;
              backdrop-filter: blur(24px) saturate(180%) !important;
              -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
              border: 1px solid rgba(255, 255, 255, 0.18) !important;
              box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 1px rgba(255, 255, 255, 0.2) !important;
              border-radius: 24px !important;
            }

            .route:not(.active) .route-icon-wrap ha-icon {
              color: rgba(226, 232, 240, 0.75) !important;
            }

            .route:not(.active) .route-label {
              color: rgba(203, 213, 225, 0.75) !important;
              font-weight: 500 !important;
            }

            .route.active .route-label {
              color: #ffffff !important;
              font-weight: 700 !important;
            }
