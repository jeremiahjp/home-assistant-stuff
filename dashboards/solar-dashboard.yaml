title: Solar & Energy Monitor
theme: celestial
views:
  - title: Live Overview
    path: live-energy
    icon: mdi:lightning-bolt-circle
    type: sections
    max_columns: 3
    background: transparent
    badges:
      - entity: binary_sensor.home_solar_energy_monitor_solar_daemon_service
        name: Daemon
        color: teal
      - entity: sensor.home_solar_energy_monitor_solar_production
        name: Solar
        color: amber
      - entity: sensor.home_solar_energy_monitor_house_consumption
        name: House
        color: blue
      - entity: sensor.home_solar_energy_monitor_grid_net_power
        name: Grid Net
        color: purple
      - entity: sensor.home_solar_energy_monitor_self_powered_ratio
        name: Self-Powered
        color: green
      - entity: sensor.home_solar_energy_monitor_inverter_temperature
        name: Inverter Temp
    sections:
      - type: grid
        cards:
          - type: markdown
            card_mod:
              style:
                ha-markdown:
                  $: >
                    ha-markdown-element {
                      text-align: center !important;
                    }

                    h2 {
                      text-align: center !important;
                      font-size: 20px !important;
                      font-weight: 800 !important;
                      letter-spacing: -0.3px !important;
                      margin: 0 !important;
                      line-height: 1.3 !important;
                      background: linear-gradient(90deg, #fff 30%, rgba(255,255,255,0.65));
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      background-clip: text;
                    }

                    div {
                      display: flex !important;
                      flex-wrap: wrap !important;
                      justify-content: center !important;
                      align-items: center !important;
                      gap: 6px !important;
                      margin-top: 10px !important;
                      width: 100% !important;
                    }

                    span {
                      display: inline-flex !important;
                      align-items: center !important;
                      justify-content: center !important;
                    }
                .: >
                  {% set elev = state_attr('sun.sun', 'elevation') | float(0) %}

                  {% set azi = state_attr('sun.sun', 'azimuth') | float(180) %}

                  {% if elev > 20 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,179,0,0.22) 0%, rgba(255,100,0,0.08) 40%, rgba(15,23,42,0.92) 100%)" %}
                    {% set bdr = "rgba(255,179,0,0.35)" %}
                    {% set glow = "0 8px 40px rgba(255,140,0,0.18), inset 0 1px 0 rgba(255,255,255,0.08)" %}
                    {% set shimmer = "rgba(255,200,50,0.07)" %}
                  {% elif elev > 5 and azi < 180 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,200,50,0.18) 0%, rgba(255,160,0,0.08) 40%, rgba(15,23,42,0.92) 100%)" %}
                    {% set bdr = "rgba(255,200,50,0.30)" %}
                    {% set glow = "0 8px 40px rgba(255,180,0,0.14), inset 0 1px 0 rgba(255,255,255,0.06)" %}
                    {% set shimmer = "rgba(255,200,50,0.06)" %}
                  {% elif elev > 5 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,120,0,0.20) 0%, rgba(200,50,100,0.08) 40%, rgba(15,23,42,0.92) 100%)" %}
                    {% set bdr = "rgba(255,120,0,0.30)" %}
                    {% set glow = "0 8px 40px rgba(255,100,0,0.14), inset 0 1px 0 rgba(255,255,255,0.06)" %}
                    {% set shimmer = "rgba(255,150,50,0.06)" %}
                  {% elif elev > -2 and azi < 180 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,130,50,0.20) 0%, rgba(180,80,160,0.12) 40%, rgba(15,23,42,0.94) 100%)" %}
                    {% set bdr = "rgba(255,130,50,0.28)" %}
                    {% set glow = "0 8px 40px rgba(255,100,50,0.12), inset 0 1px 0 rgba(255,255,255,0.05)" %}
                    {% set shimmer = "rgba(255,140,80,0.05)" %}
                  {% elif elev > -2 %}
                    {% set bg = "linear-gradient(135deg, rgba(255,87,34,0.22) 0%, rgba(156,39,176,0.12) 40%, rgba(15,23,42,0.94) 100%)" %}
                    {% set bdr = "rgba(255,87,34,0.30)" %}
                    {% set glow = "0 8px 40px rgba(255,87,34,0.14), inset 0 1px 0 rgba(255,255,255,0.05)" %}
                    {% set shimmer = "rgba(255,100,60,0.05)" %}
                  {% elif elev > -6 %}
                    {% set bg = "linear-gradient(135deg, rgba(100,50,150,0.22) 0%, rgba(50,30,100,0.12) 40%, rgba(12,18,38,0.96) 100%)" %}
                    {% set bdr = "rgba(130,80,200,0.22)" %}
                    {% set glow = "0 8px 40px rgba(100,50,150,0.10), inset 0 1px 0 rgba(255,255,255,0.04)" %}
                    {% set shimmer = "rgba(120,80,200,0.04)" %}
                  {% else %}
                    {% set bg = "linear-gradient(135deg, rgba(30,40,80,0.5) 0%, rgba(15,20,50,0.6) 50%, rgba(10,12,30,0.97) 100%)" %}
                    {% set bdr = "rgba(80,100,180,0.18)" %}
                    {% set glow = "0 8px 40px rgba(30,50,120,0.08), inset 0 1px 0 rgba(255,255,255,0.03)" %}
                    {% set shimmer = "rgba(60,80,180,0.03)" %}
                  {% endif %}

                  ha-card {
                    text-align: center !important;
                    background: {{ bg }} !important;
                    border: 1px solid {{ bdr }} !important;
                    border-radius: 20px !important;
                    box-shadow: {{ glow }} !important;
                    padding: 18px 22px 14px 22px !important;
                    backdrop-filter: blur(20px) !important;
                    -webkit-backdrop-filter: blur(20px) !important;
                    position: relative !important;
                    overflow: hidden !important;
                    transition: all 0.6s ease !important;
                  }

                  ha-card::before {
                    content: '';
                    position: absolute;
                    top: -80%;
                    left: -80%;
                    width: 260%;
                    height: 260%;
                    background: radial-gradient(ellipse, {{ shimmer }} 0%, transparent 55%);
                    animation: hero-shimmer 6s ease-in-out infinite;
                    pointer-events: none;
                  }

                  @keyframes hero-shimmer {
                    0%, 100% { opacity: 0.4; transform: translate(0, 0) scale(1); }
                    50% { opacity: 1; transform: translate(5%, 5%) scale(1.1); }
                  }
            content: |-
              {% set solar = states('sensor.home_solar_energy_monitor_solar_production') | float(0) %} {% set house = states('sensor.home_solar_energy_monitor_house_consumption') | float(0) %} {% set elev = state_attr('sun.sun', 'elevation') | float(0) %} {% set azi = state_attr('sun.sun', 'azimuth') | float(180) %} {% set rising = azi < 180 %} {% set next_set = state_attr('sun.sun', 'next_setting') %} {% set next_rise = state_attr('sun.sun', 'next_rising') %} {% set temp = state_attr('weather.forecast_home', 'temperature') | float(0) | round(0) %} {% set clouds = state_attr('weather.forecast_home', 'cloud_coverage') | float(0) | round(0) %} {% set weather_raw = states('weather.forecast_home') %} {% set weather_txt = weather_raw | replace('-', ' ') | title if weather_raw not in ['unknown', 'unavailable'] else '' %} {% if elev > 20 %} {% set title = "☀️ FULL DAYLIGHT • PEAK SUN" %} {% elif elev > 5 and rising %} {% set title = "🌤️ MORNING GOLDEN HOUR" %} {% elif elev > 5 %} {% set title = "🌇 AFTERNOON GOLDEN HOUR" %} {% elif elev > -2 and rising %} {% set title = "🌅 SUNRISE • DAY DAWNING" %} {% elif elev > -2 %} {% set title = "🌆 SUNSET • FINAL LIGHT" %} {% elif elev > -6 and rising %} {% set title = "🌃 EARLY DAWN • FIRST LIGHT" %} {% elif elev > -6 %} {% set title = "🌆 LATE DUSK • TWILIGHT" %} {% else %} {% set title = "🌙 DEEP NIGHT • STARFIELD" %} {% endif %} {% set pill = 'display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.3px;' %} {% set pill_bg = 'background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.85);' %}
              ## {{ title }}
              <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;"> <span style="{{ pill }}{{ pill_bg }}">🌡️ {{ temp }}°F {{ weather_txt }}</span> <span style="{{ pill }}{{ pill_bg }}">⚡ {{ solar | round(0) }} W{% if solar > 0 %} ({{ (solar / 78.4) | round(0) }}%){% endif %}</span> <span style="{{ pill }}{{ pill_bg }}">☁️ {{ clouds }}%</span> <span style="{{ pill }}{{ pill_bg }}">📐 {{ elev | round(1) }}°</span> {% if elev > -2 and not rising %} <span style="{{ pill }}{{ pill_bg }}">🌅 {{ as_timestamp(next_set) | timestamp_custom('%I:%M %p') if next_set else '—' }}</span> {% elif elev <= -2 %} <span style="{{ pill }}{{ pill_bg }}">🌄 {{ as_timestamp(next_rise) | timestamp_custom('%I:%M %p') if next_rise else '—' }}</span> {% endif %} <span style="{{ pill }}{{ pill_bg }}">🏠 {{ house | round(0) }} W</span> </div>
            grid_options:
              columns: full
        column_span: 3
      - type: grid
        column_span: 2
        cards:
          - type: custom:power-flow-card-plus
            title: Live Energy Distribution
            entities:
              solar:
                entity: sensor.home_solar_energy_monitor_solar_production
                name: Solar
                icon: mdi:solar-power
                color_icon: true
                display_zero: true
                secondary_info:
                  entity: sensor.home_solar_energy_monitor_solar_produced_today
                  unit_of_measurement: kWh
              grid:
                entity: sensor.home_solar_energy_monitor_grid_net_power
                name: Grid
                icon: mdi:transmission-tower
                color_icon: true
                display_zero: true
                secondary_info:
                  entity: sensor.home_solar_energy_monitor_net_energy_cost_today
              home:
                entity: sensor.home_solar_energy_monitor_house_consumption
                name: House
                icon: mdi:home-lightning-bolt
                color_icon: true
                secondary_info:
                  entity: sensor.home_solar_energy_monitor_house_consumed_today
                  unit_of_measurement: kWh
                individual:
                  - entity: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
                    name: HVAC / AC (est)
                    icon: mdi:hvac
                    color_icon: true
                  - entity: sensor.home_solar_energy_monitor_circuit_office
                    name: Office
                    icon: mdi:desktop-tower
                    color_icon: true
                  - entity: sensor.fridge_circuit_circuit_fridge
                    name: Fridge
                    icon: mdi:fridge-outline
                    color_icon: true
                  - entity: sensor.home_solar_energy_monitor_circuit_dedicated_freezer
                    name: Freezer
                    icon: mdi:snowflake
                    color_icon: true
            clickable_entities: true
            display_zero_lines: true
            use_new_flow_rate_model: true
            w_decimals: 0
            kw_decimals: 2
            min_flow_rate: 0.9
            max_flow_rate: 6
      - title: Inverter Performance & Telemetry
        type: grid
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.home_solar_energy_monitor_solar_production
                name: Solar AC Output
                needle: true
                min: 0
                max: 7840
                severity:
                  green: 4500
                  yellow: 2000
                  red: 0
              - type: gauge
                entity: sensor.home_solar_energy_monitor_self_powered_ratio
                name: Self-Powered
                needle: true
                min: 0
                max: 100
                severity:
                  red: 0
                  yellow: 40
                  green: 75
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_dc_power
                name: Solar DC Input
                icon: mdi:solar-panel-large
                color: orange
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_inverter_temperature
                name: Inverter Temp
                icon: mdi:thermometer-check
                color: red
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_produced_today
                name: Solar Today
                icon: mdi:solar-power-variant
                color: amber
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_house_consumed_today
                name: House Today
                icon: mdi:home-lightning-bolt
                color: light-blue
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_grid_exported_today
                name: Grid Export Today
                icon: mdi:transmission-tower-export
                color: teal
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_grid_imported_today
                name: Grid Import Today
                icon: mdi:transmission-tower
                color: indigo
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_net_energy_cost_today
                name: Net Cost Today
                icon: mdi:cash-check
                color: green
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_lifetime_production
                name: Lifetime Harvest
                icon: mdi:medal-outline
                color: deep-purple
                vertical: false
      - title: Power Profile Timeline
        type: grid
        column_span: 3
        cards:
          - type: horizontal-stack
            cards:
              - type: button
                name: 1 Hour
                icon: mdi:clock-time-one-outline
                show_state: false
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.energy_graph_range
                  data:
                    option: 1h
                card_mod:
                  style: >
                    ha-card {
                      background: {{ 'rgba(56, 189, 248, 0.28)' if is_state('input_select.energy_graph_range', '1h') else 'rgba(15, 23, 42, 0.70)' }} !important;
                      border: 1px solid {{ '#38bdf8' if is_state('input_select.energy_graph_range', '1h') else 'rgba(255, 255, 255, 0.10)' }} !important;
                      border-radius: 12px !important;
                      transition: all 0.2s ease !important;
                    }
              - type: button
                name: 4 Hours
                icon: mdi:clock-time-four-outline
                show_state: false
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.energy_graph_range
                  data:
                    option: 4h
                card_mod:
                  style: >
                    ha-card {
                      background: {{ 'rgba(56, 189, 248, 0.28)' if is_state('input_select.energy_graph_range', '4h') else 'rgba(15, 23, 42, 0.70)' }} !important;
                      border: 1px solid {{ '#38bdf8' if is_state('input_select.energy_graph_range', '4h') else 'rgba(255, 255, 255, 0.10)' }} !important;
                      border-radius: 12px !important;
                      transition: all 0.2s ease !important;
                    }
              - type: button
                name: 8 Hours
                icon: mdi:clock-time-eight-outline
                show_state: false
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.energy_graph_range
                  data:
                    option: 8h
                card_mod:
                  style: >
                    ha-card {
                      background: {{ 'rgba(56, 189, 248, 0.28)' if is_state('input_select.energy_graph_range', '8h') else 'rgba(15, 23, 42, 0.70)' }} !important;
                      border: 1px solid {{ '#38bdf8' if is_state('input_select.energy_graph_range', '8h') else 'rgba(255, 255, 255, 0.10)' }} !important;
                      border-radius: 12px !important;
                      transition: all 0.2s ease !important;
                    }
              - type: button
                name: 24 Hours
                icon: mdi:clock-time-twelve-outline
                show_state: false
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  target:
                    entity_id: input_select.energy_graph_range
                  data:
                    option: 24h
                card_mod:
                  style: >
                    ha-card {
                      background: {{ 'rgba(56, 189, 248, 0.28)' if is_state('input_select.energy_graph_range', '24h') else 'rgba(15, 23, 42, 0.70)' }} !important;
                      border: 1px solid {{ '#38bdf8' if is_state('input_select.energy_graph_range', '24h') else 'rgba(255, 255, 255, 0.10)' }} !important;
                      border-radius: 12px !important;
                      transition: all 0.2s ease !important;
                    }
          - type: conditional
            conditions:
              - entity: input_select.energy_graph_range
                state: 1h
            card:
              type: custom:apexcharts-card
              experimental:
                disable_config_validation: true
              header:
                show: true
                title: 1-Hour Power Profile (1m Resolution)
                show_states: true
                colorize_states: true
              graph_span: 1h
              span:
                end: minute
              update_interval: 30s
              all_series_config:
                curve: smooth
                group_by:
                  func: avg
                  duration: 1m
              apex_config:
                chart:
                  height: 330px
                  zoom:
                    enabled: false
                  toolbar:
                    show: false
                grid:
                  borderColor: rgba(255, 255, 255, 0.08)
                  strokeDashArray: 3
                legend:
                  show: true
                  position: top
                  horizontalAlign: right
                  labels:
                    colors: "#cbd5e1"
                tooltip:
                  shared: true
                  intersect: false
                  theme: dark
                stroke:
                  curve: smooth
              yaxis:
                - id: power
                  min: 0
                  decimals: 0
                  apex_config:
                    title:
                      text: Solar & House (W)
                      style:
                        color: "#94a3b8"
                        fontSize: 11px
                        fontWeight: 500
                    labels:
                      style:
                        colors: "#94a3b8"
                        fontSize: 11px
                - id: grid
                  opposite: true
                  decimals: 0
                  apex_config:
                    title:
                      text: Grid Net (W)
                      style:
                        color: "#d946ef"
                        fontSize: 11px
                        fontWeight: 500
                    labels:
                      style:
                        colors: "#d946ef"
                        fontSize: 11px
              series:
                - entity: sensor.home_solar_energy_monitor_solar_production
                  name: Solar Generated
                  yaxis_id: power
                  color: "#ffb300"
                  type: area
                  opacity: 0.28
                  stroke_width: 2.8
                  fill_raw: last
                - entity: sensor.home_solar_energy_monitor_house_consumption
                  name: House Consumed
                  yaxis_id: power
                  color: "#00e5ff"
                  type: line
                  stroke_width: 2.8
                  fill_raw: last
                - entity: sensor.home_solar_energy_monitor_grid_net_power
                  name: Grid Net (+Import / -Export)
                  yaxis_id: grid
                  color: "#d946ef"
                  type: line
                  stroke_width: 1.8
                  fill_raw: last
              card_mod:
                style: |
                  ha-card {
                    background: rgba(15, 23, 42, 0.75) !important;
                    backdrop-filter: blur(16px) !important;
                    border: 1px solid rgba(255, 255, 255, 0.10) !important;
                    border-radius: 18px !important;
                  }
          - type: conditional
            conditions:
              - entity: input_select.energy_graph_range
                state: 4h
            card:
              type: custom:apexcharts-card
              experimental:
                disable_config_validation: true
              header:
                show: true
                title: 4-Hour Power Profile (2m Resolution)
                show_states: true
                colorize_states: true
              graph_span: 4h
              span:
                end: minute
              update_interval: 1m
              all_series_config:
                curve: smooth
                group_by:
                  func: avg
                  duration: 2m
              apex_config:
                chart:
                  height: 330px
                  zoom:
                    enabled: false
                  toolbar:
                    show: false
                grid:
                  borderColor: rgba(255, 255, 255, 0.08)
                  strokeDashArray: 3
                legend:
                  show: true
                  position: top
                  horizontalAlign: right
                  labels:
                    colors: "#cbd5e1"
                tooltip:
                  shared: true
                  intersect: false
                  theme: dark
                stroke:
                  curve: smooth
              yaxis:
                - id: power
                  min: 0
                  decimals: 0
                  apex_config:
                    title:
                      text: Solar & House (W)
                      style:
                        color: "#94a3b8"
                        fontSize: 11px
                        fontWeight: 500
                    labels:
                      style:
                        colors: "#94a3b8"
                        fontSize: 11px
                - id: grid
                  opposite: true
                  decimals: 0
                  apex_config:
                    title:
                      text: Grid Net (W)
                      style:
                        color: "#d946ef"
                        fontSize: 11px
                        fontWeight: 500
                    labels:
                      style:
                        colors: "#d946ef"
                        fontSize: 11px
              series:
                - entity: sensor.home_solar_energy_monitor_solar_production
                  name: Solar Generated
                  yaxis_id: power
                  color: "#ffb300"
                  type: area
                  opacity: 0.28
                  stroke_width: 2.8
                  fill_raw: last
                - entity: sensor.home_solar_energy_monitor_house_consumption
                  name: House Consumed
                  yaxis_id: power
                  color: "#00e5ff"
                  type: line
                  stroke_width: 2.8
                  fill_raw: last
                - entity: sensor.home_solar_energy_monitor_grid_net_power
                  name: Grid Net (+Import / -Export)
                  yaxis_id: grid
                  color: "#d946ef"
                  type: line
                  stroke_width: 1.8
                  fill_raw: last
              card_mod:
                style: |
                  ha-card {
                    background: rgba(15, 23, 42, 0.75) !important;
                    backdrop-filter: blur(16px) !important;
                    border: 1px solid rgba(255, 255, 255, 0.10) !important;
                    border-radius: 18px !important;
                  }
          - type: conditional
            conditions:
              - entity: input_select.energy_graph_range
                state: 8h
            card:
              type: custom:apexcharts-card
              experimental:
                disable_config_validation: true
              header:
                show: true
                title: 8-Hour Power Profile (3m Resolution)
                show_states: true
                colorize_states: true
              graph_span: 8h
              span:
                end: minute
              update_interval: 2m
              all_series_config:
                curve: smooth
                group_by:
                  func: avg
                  duration: 3m
              apex_config:
                chart:
                  height: 330px
                  zoom:
                    enabled: false
                  toolbar:
                    show: false
                grid:
                  borderColor: rgba(255, 255, 255, 0.08)
                  strokeDashArray: 3
                legend:
                  show: true
                  position: top
                  horizontalAlign: right
                  labels:
                    colors: "#cbd5e1"
                tooltip:
                  shared: true
                  intersect: false
                  theme: dark
                stroke:
                  curve: smooth
              yaxis:
                - id: power
                  min: 0
                  decimals: 0
                  apex_config:
                    title:
                      text: Solar & House (W)
                      style:
                        color: "#94a3b8"
                        fontSize: 11px
                        fontWeight: 500
                    labels:
                      style:
                        colors: "#94a3b8"
                        fontSize: 11px
                - id: grid
                  opposite: true
                  decimals: 0
                  apex_config:
                    title:
                      text: Grid Net (W)
                      style:
                        color: "#d946ef"
                        fontSize: 11px
                        fontWeight: 500
                    labels:
                      style:
                        colors: "#d946ef"
                        fontSize: 11px
              series:
                - entity: sensor.home_solar_energy_monitor_solar_production
                  name: Solar Generated
                  yaxis_id: power
                  color: "#ffb300"
                  type: area
                  opacity: 0.28
                  stroke_width: 2.8
                  fill_raw: last
                - entity: sensor.home_solar_energy_monitor_house_consumption
                  name: House Consumed
                  yaxis_id: power
                  color: "#00e5ff"
                  type: line
                  stroke_width: 2.8
                  fill_raw: last
                - entity: sensor.home_solar_energy_monitor_grid_net_power
                  name: Grid Net (+Import / -Export)
                  yaxis_id: grid
                  color: "#d946ef"
                  type: line
                  stroke_width: 1.8
                  fill_raw: last
              card_mod:
                style: |
                  ha-card {
                    background: rgba(15, 23, 42, 0.75) !important;
                    backdrop-filter: blur(16px) !important;
                    border: 1px solid rgba(255, 255, 255, 0.10) !important;
                    border-radius: 18px !important;
                  }
          - type: conditional
            conditions:
              - entity: input_select.energy_graph_range
                state: 24h
            card:
              type: custom:apexcharts-card
              experimental:
                disable_config_validation: true
              header:
