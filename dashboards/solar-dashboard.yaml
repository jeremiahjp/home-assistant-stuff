    footer:
      card:
        type: markdown
        card_mod:
          style:
            ha-markdown:
              $: |
                ha-markdown-element {
                  text-align: center !important;
                }
                div {
                  display: flex !important;
                  flex-wrap: wrap !important;
                  justify-content: center !important;
                  align-items: center !important;
                  gap: 8px !important;
                  width: 100% !important;
                }
                span {
                  display: inline-flex !important;
                  align-items: center !important;
                  justify-content: center !important;
                }
            .: |
              ha-card {
                background: rgba(15, 23, 42, 0.90) !important;
                backdrop-filter: blur(20px) !important;
                -webkit-backdrop-filter: blur(20px) !important;
                border: 1px solid rgba(255, 255, 255, 0.12) !important;
                border-radius: 20px !important;
                box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5) !important;
                margin: 0 auto !important;
                padding: 6px 16px !important;
                max-width: 900px !important;
              }
        content: |-
          {% set service = states('binary_sensor.home_solar_energy_monitor_solar_daemon_service') %} {% set uptime = states('sensor.home_solar_energy_monitor_daemon_uptime') %} {% set ram = states('sensor.home_solar_energy_monitor_daemon_memory_usage') %} {% set err_count = states('sensor.home_solar_energy_monitor_daemon_error_count') | int(0) %} {% set pill = 'display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;letter-spacing:0.2px;' %} {% set pill_dark = 'background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.08);' %} {% set pill_green = 'background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.25);' %} {% set pill_red = 'background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);' %}
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;width:100%;"> <span style="{{ pill }}{% if service == 'on' %}{{ pill_green }}{% else %}{{ pill_red }}{% endif %}">{% if service == 'on' %}🟢 Daemon Active{% else %}🔴 Daemon Offline{% endif %}</span> <span style="{{ pill }}{{ pill_dark }}">⏱️ {{ uptime }}</span> <span style="{{ pill }}{{ pill_dark }}">💾 {{ ram }} MB</span> {% if err_count == 0 %} <span style="{{ pill }}{{ pill_green }}">✓ 0 Errors • Pipeline Healthy</span> {% else %} <span style="{{ pill }}{{ pill_red }}">⚠️ {{ err_count }} Errors Logged</span> {% endif %} </div>
